task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]
  verbose: False

# Object classes only; background is handled implicitly by the sigmoid loss.
num_classes: 1
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /Users/satoshi/projects/python/clover_detection/datasets/train/images
    ann_file: /Users/satoshi/projects/python/clover_detection/datasets/train/instances_train.json
    return_masks: False
    transforms:
      type: Compose
      # YOLO-style augmentation: hsv_s=0.5, degrees=15, flipud/fliplr=0.5,
      # scale=0.3, mosaic=0, perspective=0.00005, translate=0.
      # RandomPerspective jointly handles rotation, scale and perspective.
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: RandomPerspective, degrees: 15, translate: 0, scale: 0.3, perspective: 0.00005, fill: 114}
        - {type: RandomHSV, hgain: 0.15, sgain: 0.5, vgain: 0.4}
        # contrast=0.5 samples a factor in [0.5, 1.5] for every image.
        - {type: ColorJitter, contrast: 0.5}
        # Same blur/noise parameters as the custom pose pipeline.
        - {type: MotionBlur, kernel_size: [3, 9], angle: [-180, 180], p: 0.2}
        - {type: GaussianBlur, kernel_size: 5, sigma: [0.1, 2.0], p: 0.3}
        - {type: GaussianNoise, mean: 0, std: 0.05, p: 0.5, clip: True}
        - {type: RandomVerticalFlip, p: 0.5}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy: stop_epoch
      start_epoch: 0
      mosaic_epoch: 15
      mosaic_prob: 0
      stop_epoch: 58
      remove_ops: ['RandomPerspective', 'RandomHSV', 'ColorJitter', 'MotionBlur', 'GaussianBlur', 'GaussianNoise']
  shuffle: True
  num_workers: 8
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    # scale=0.3 is handled above; disable additional batch multi-scale jitter.
    base_size: 640
    base_size_repeat: ~
    mixup_prob: 0
    copyblend_prob: 0
    stop_epoch: 58

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /Users/satoshi/projects/python/clover_detection/datasets/valid/images
    ann_file: /Users/satoshi/projects/python/clover_detection/datasets/valid/instances_val.json
    return_masks: False
    transforms:
      type: Compose
      # Validation uses deterministic preprocessing without augmentation.
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
  shuffle: False
  num_workers: 8
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
